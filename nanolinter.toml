# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the SAST
# and dependency scans the pull request gate ran before.
# `nanolinter explain --all` lists more checks.
#
# The Prettier check of `just lint-all` (lint-node-format) is not here: the
# Java lint image has no Node.js, so it would be skipped. Run it locally.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]
