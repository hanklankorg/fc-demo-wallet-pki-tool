# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the SAST
# and dependency scans the pull request gate ran before.
# `nanolinter explain --all` lists more checks.
#
# The Prettier check of `just lint-all` (lint-node-format) is not here: the
# Java lint image has no Node.js. The format-xml job of the pull request
# workflow runs it.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

# The tool writes its key and keystore files readable by other users
# (rw-r--r--), on purpose since "fix: loosen permissions on keystores"
# (d8c0441). The SAST rule that reports it is left out by its exact id, so
# the gate passes as it did before; whether the files should be readable is
# for the maintainers to decide. An inline nosemgrep comment would be longer
# than the Java formatter allows.
[linters.sast.settings]
"opengrep.exclude_rules" = [
  "java.lang.security.audit.overly-permissive-file-permission.overly-permissive-file-permission",
]
