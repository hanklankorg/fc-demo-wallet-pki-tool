# The rule and the paths `just lint-markdown` leaves out on its command
# line, so the pull request gate judges Markdown as `just lint-all` does.
[global]
disable = ["MD013"]
exclude = [".github-shared", "node_modules", "vendor", "target", "CHANGELOG.md"]
